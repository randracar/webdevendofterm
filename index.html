<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The story of the Internet since 2006</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cactus+Classical+Serif&display=swap" rel="stylesheet">

    <script>
        
        function openNav() {
            document.getElementById("mySidenav").style.width = "250px";
            document.getElementById("main").style.marginLeft = "250px";
            document.getElementById("menu").style.display = "none";
        }

        function closeNav() {
            document.getElementById("mySidenav").style.width = "0";
            document.getElementById("main").style.marginLeft= "0";
            document.getElementById("menu").style.display = "block";
        }
    </script>
</head>
<body>

    <div id="mySidenav" class="sidenav">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <h2 class="cactus-classical-serif-regular">Menu</h2>
        <a href="#introduction" class="cactus-classical-serif-regular">Introduction</a>
        <a href="#next-part" class="cactus-classical-serif-regular">next part</a>
        <a href="#another-part" class="cactus-classical-serif-regular">another part</a>
        <a href="#conclusion" class="cactus-classical-serif-regular">Conclusion</a>
    </div>

<!-- Use any element to open the sidenav -->

<!-- Add all page content inside this div if you want the side nav to push page content to the right (not used if you only want the sidenav to sit on top of the page -->
<div id="main">
    <!-- top bar -->
    <div class="topnav">
        <h1 onclick="openNav()" id="menu" class="cactus-classical-serif-regular">Menu</h1>
        <a href="#" class="cactus-classical-serif-regular">Contact</a>
        <a href="#" class="cactus-classical-serif-regular">About</a>
        <a href="#" class="cactus-classical-serif-regular">Home</a>
    </div>

    <div class="main-content">
        <h1 class="Title" id="introduction">Lore Ipsum dolor sit amet dus whatever</h1> 
    </div>
</div>

    
</body>
