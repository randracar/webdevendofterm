<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The story of the Internet since 2006</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cactus+Classical+Serif&family=M+PLUS+Rounded+1c&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">


    <script>

        function openImageModal(image) {
            const modal = document.getElementById("imageModal");
            const modalImage = document.getElementById("modalImage");
            modalImage.src = image.src;
            modalImage.alt = image.alt;
            modal.classList.add("open");
        }

        function closeImageModal() {
            const modal = document.getElementById("imageModal");
            modal.classList.remove("open");
        }

        document.addEventListener("DOMContentLoaded", function() {
            const modal = document.getElementById("imageModal");
            const closeButton = document.getElementById("closeModal");
            const images = document.querySelectorAll("img");

            images.forEach((image) => {
                image.addEventListener("click", function() {
                    openImageModal(image);
                });
            });

            closeButton.addEventListener("click", closeImageModal);
        });
    </script>
</head>
<body>

    <div id="imageModal" class="image-modal" aria-hidden="true" role="dialog" aria-modal="true">
        <button id="closeModal" class="modal-close" aria-label="Close image">&times;</button>
        <img id="modalImage" src="" alt="Expanded view">
    </div>
